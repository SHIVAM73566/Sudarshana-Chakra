name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality Gate (Windows)
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.12", "3.13" ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyflakes pytest

      - name: Install project dependencies
        run: python -m pip install -r requirements.txt

      - name: Byte-compile the entire source tree
        shell: pwsh
        run: |
          python -c "import compileall, re, sys; ok = compileall.compile_dir('.', quiet=1, maxlevels=10, rx=re.compile(r'(\.venv|release|__pycache__|build|dist|node_modules|generated)')); print('COMPILE_OK' if ok else 'COMPILE_FAILED'); sys.exit(0 if ok else 1)"

      - name: Static analysis (undefined names, redefinitions, syntax)
        shell: pwsh
        run: |
          $files = Get-ChildItem -Recurse -Filter *.py |
            Where-Object { $_.FullName -notmatch '\\(\.venv|release|__pycache__|build|dist|node_modules|generated)\\' } |
            ForEach-Object { $_.FullName }
          $out = python -m pyflakes @files 2>&1
          $critical = $out | Select-String -Pattern 'undefined name|redefinition of|syntax error|invalid syntax'
          if ($critical) { $critical | ForEach-Object { Write-Host $_ }; exit 1 }
          Write-Host 'STATIC_OK - no critical issues'

      - name: Hygiene (no bare excepts)
        shell: pwsh
        run: |
          $script = @'
          import ast, re, sys
          from pathlib import Path
          SKIP = re.compile(r'(\.venv|release|__pycache__|build|dist|node_modules|generated)')
          bad = []
          for p in Path('.').rglob('*.py'):
              if SKIP.search(str(p)):
                  continue
              try:
                  tree = ast.parse(p.read_text(encoding='utf-8', errors='ignore'), filename=str(p))
              except SyntaxError as e:
                  bad.append(f'{p}:{e.lineno}: {e.msg}')
                  continue
              for node in ast.walk(tree):
                  if isinstance(node, ast.ExceptHandler) and node.type is None:
                      bad.append(f'{p}:{node.lineno}: bare except')
          if bad:
              print('\n'.join(bad)); sys.exit(1)
          print('HYGIENE_OK')
          '@
          Set-Content -Path hygiene_check.py -Value $script
          python hygiene_check.py

      - name: Run unit tests
        shell: pwsh
        run: python -m pytest tests -q

  security:
    name: Security Scan
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Scan for committed secrets
        shell: pwsh
        run: |
          $patterns = 'AKIA[0-9A-Z]{16}','nvapi-[A-Za-z0-9_\-]{20,}','AIza[0-9A-Za-z_\-]{30,}','sk-[A-Za-z0-9]{20,}','ghp_[A-Za-z0-9]{30,}'
          $files = Get-ChildItem -Recurse -File |
            Where-Object { $_.FullName -notmatch '\\(\.venv|release|\.git|__pycache__|node_modules)\\' -and $_.Extension -notin '.png','.jpg','.jpeg','.gif','.ico','.zip','.woff','.woff2' }
          $hits = @()
          foreach ($f in $files) {
            foreach ($p in $patterns) {
              $m = Select-String -Path $f.FullName -Pattern $p -AllMatches -ErrorAction SilentlyContinue
              if ($m) { $hits += "$($f.FullName): $($m.Matches[0].Value.Substring(0,[Math]::Min(12,$m.Matches[0].Value.Length)))..." }
            }
          }
          if ($hits.Count -gt 0) { $hits | ForEach-Object { Write-Host "POTENTIAL SECRET: $_" }; exit 1 }
          Write-Host 'SECRET_SCAN_CLEAN'
