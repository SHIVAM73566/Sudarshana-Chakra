<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Sudarshana Chakra — Autonomous Desktop Operating Intelligence">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0F19"/>
      <stop offset="0.55" stop-color="#0E1424"/>
      <stop offset="1" stop-color="#070A12"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#00F0FF" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#12B5FF" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#00F0FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="disc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F5B700"/>
      <stop offset="0.5" stop-color="#00F0FF"/>
      <stop offset="1" stop-color="#F5B700"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.6" stop-color="#DCEBFF"/>
      <stop offset="1" stop-color="#8FE9FF"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- grid -->
  <g stroke="#1C2740" stroke-width="1" opacity="0.5">
    <path d="M0 105H1200M0 210H1200M0 315H1200M0 420H1200M0 525H1200"/>
    <path d="M150 0V630M300 0V630M450 0V630M600 0V630M750 0V630M900 0V630M1050 0V630"/>
  </g>

  <!-- Chakra emblem -->
  <g transform="translate(985 315)" filter="url(#soft)">
    <circle r="150" fill="none" stroke="url(#disc)" stroke-width="3" opacity="0.9"/>
    <circle r="118" fill="none" stroke="#00F0FF" stroke-width="2" opacity="0.55"/>
    <g stroke="url(#disc)" stroke-width="4" stroke-linecap="round">
      <path d="M0-150V-108M0 150V108M-150 0H-108M150 0H108"/>
      <path d="M106-106 76-76M-106 106-76 76M106 106 76 76M-106-106-76-76"/>
    </g>
    <!-- 24 blades -->
    <g stroke="url(#disc)" stroke-width="5" stroke-linecap="round" opacity="0.95">
      <path d="M0-118 6-96-6-96Z"/>
      <path d="M0-118 6-96-6-96Z" transform="rotate(15)"/>
      <path d="M0-118 6-96-6-96Z" transform="rotate(30)"/>
      <path d="M0-118 6-96-6-96Z" transform="rotate(45)"/>
      <path d="M0-118 6-96-6-96Z" transform="rotate(60)"/>
      <path d="M0-118 6-96-6-96Z" transform="rotate(75)"/>
      <path d="M0-118 6-96-6-96Z" transform="rotate(90)"/>
      <path d="M0-118 6-96-6-96Z" transform="rotate(105)"/>
      <path d="M0-118 6-96-6-96Z" transform="rotate(120)"/>
      <path d="M0-118 6-96-6-96Z" transform="rotate(135)"/>
      <path d="M0-118 6-96-6-96Z" transform="rotate(150)"/>
      <path d="M0-118 6-96-6-96Z" transform="rotate(165)"/>
      <path d="M0-118 6-96-6-96Z" transform="rotate(180)"/>
      <path d="M0-118 6-96-6-96Z" transform="rotate(195)"/>
      <path d="M0-118 6-96-6-96Z" transform="rotate(210)"/>
      <path d="M0-118 6-96-6-96Z" transform="rotate(225)"/>
      <path d="M0-118 6-96-6-96Z" transform="rotate(240)"/>
      <path d="M0-118 6-96-6-96Z" transform="rotate(255)"/>
      <path d="M0-118 6-96-6-96Z" transform="rotate(270)"/>
      <path d="M0-118 6-96-6-96Z" transform="rotate(285)"/>
      <path d="M0-118 6-96-6-96Z" transform="rotate(300)"/>
      <path d="M0-118 6-96-6-96Z" transform="rotate(315)"/>
      <path d="M0-118 6-96-6-96Z" transform="rotate(330)"/>
      <path d="M0-118 6-96-6-96Z" transform="rotate(345)"/>
    </g>
    <circle r="30" fill="#0B0F19" stroke="url(#disc)" stroke-width="3"/>
    <circle r="12" fill="#00F0FF" opacity="0.9"/>
  </g>

  <!-- text block -->
  <g transform="translate(80 150)">
    <text x="0" y="0" font-family="Segoe UI, Arial, sans-serif" font-size="26" letter-spacing="10" fill="#00F0FF" opacity="0.9">AUTONOMOUS DESKTOP INTELLIGENCE</text>
    <text x="0" y="88" font-family="Segoe UI, Arial, sans-serif" font-size="82" font-weight="800" fill="url(#title)">Sudarshana Chakra</text>
    <text x="0" y="150" font-family="Segoe UI, Arial, sans-serif" font-size="30" fill="#9FB2D0">The self-evolving, multimodal personal AI</text>
    <text x="0" y="192" font-family="Segoe UI, Arial, sans-serif" font-size="30" fill="#9FB2D0">assistant for Windows — voice, vision &amp; control.</text>

    <g transform="translate(0 250)" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#E8F4FF">
      <rect x="0" y="-24" rx="20" ry="20" width="205" height="40" fill="#11233A" stroke="#00F0FF" stroke-opacity="0.5"/>
      <text x="20" y="2">100+ AI tools</text>
      <rect x="225" y="-24" rx="20" ry="20" width="215" height="40" fill="#11233A" stroke="#00F0FF" stroke-opacity="0.5"/>
      <text x="245" y="2">Local-first &amp; private</text>
      <rect x="460" y="-24" rx="20" ry="20" width="200" height="40" fill="#11233A" stroke="#F5B700" stroke-opacity="0.5"/>
      <text x="480" y="2">Self-healing</text>
    </g>
  </g>

  <!-- footer -->
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="80" y="580" font-size="22" fill="#7C8DA8">github.com/SHIVAM73566/Sudarshana-Chakra</text>
    <text x="1120" y="580" font-size="22" fill="#F5B700" text-anchor="end">Windows 10 / 11 · Python 3.11+ · PyQt6</text>
  </g>
</svg>
